# Vanilla smithing table, resolved through the TLibs block checker.
station: smithing_table

# Tool used to show status and to sneak-cancel a project.
branding-tool: m.tools.goldsmith_branding_tool

# Profession node checked when using a bench. Leave empty to allow everyone.
# geminfusion.admin always bypasses. This plugin does not grant the node.
permission: professions.goldsmith

# An infused gem can occasionally improve the jewelry's stat beyond the craft-quality result.
# Chance is a percentage; higher infused-gem rarity gives a higher chance. The bonus adds to
# the craft stat factor and is capped at 100%.
jewelry-gem-stat-boost:
  amount: 10.0
  chances:
    common: 5.0
    rare: 15.0
    epic: 30.0
    legendary: 50.0
